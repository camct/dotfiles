# Non-login shell: avoid macOS path_helper wiping nix-darwin PATH in new panes.
set -g default-command "${SHELL}"

# Truecolor for nvim/rose-pine inside tmux (same file; no extra work later).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g focus-events on
set -sg escape-time 10
